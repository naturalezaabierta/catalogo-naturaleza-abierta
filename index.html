<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo · Naturaleza Abierta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --moss-bg:#E7EDE2;
    --moss-bg-2:#DCE4D5;
    --forest:#1C2E1E;
    --forest-soft:#3A4F39;
    --ochre:#B8863B;
    --ochre-dark:#8F6428;
    --clay:#A9594A;
    --cream-card:#F5F2E9;
    --line:#c7d0bd;
    --white:#fffdf8;
    --radius:14px;
    --shadow: 0 2px 10px rgba(28,46,30,0.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--moss-bg);
    color:var(--forest);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--ochre); color:var(--white);}

  /* ---------- Header ---------- */
  header{
    padding:28px 20px 18px;
    background:linear-gradient(180deg, var(--moss-bg-2), var(--moss-bg));
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
    backdrop-filter:blur(6px);
  }
  .header-inner{max-width:980px; margin:0 auto;}
  .brand{
    display:flex; align-items:baseline; gap:10px; margin-bottom:4px;
  }
  .brand svg{width:26px; height:26px; flex-shrink:0;}
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(24px,4vw,32px);
    letter-spacing:-0.01em;
    margin:0;
  }
  .brand .tag{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--forest-soft);
    font-weight:500;
  }
  .ref-banner{
    display:none;
    margin-top:10px;
    font-size:13px;
    background:var(--ochre);
    color:var(--white);
    padding:8px 14px;
    border-radius:999px;
    width:fit-content;
    font-weight:500;
  }
  .ref-banner.show{display:block;}

  .search-row{
    margin-top:18px;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .search-box{
    flex:1;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:12px 16px 12px 40px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    font-family:'Work Sans',sans-serif;
    font-size:15px;
    color:var(--forest);
    outline:none;
    transition:border-color .15s;
  }
  .search-box input:focus{border-color:var(--ochre);}
  .search-box svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; opacity:.55;
  }
  .cart-btn{
    position:relative;
    background:var(--forest);
    color:var(--white);
    border:none;
    border-radius:999px;
    padding:12px 18px;
    font-family:'Work Sans',sans-serif;
    font-weight:500;
    font-size:14px;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
    white-space:nowrap;
    transition:transform .12s;
  }
  .cart-btn:hover{transform:translateY(-1px);}
  .cart-count{
    background:var(--ochre);
    color:var(--white);
    border-radius:999px;
    min-width:20px; height:20px;
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
    padding:0 5px;
    font-weight:600;
  }

  /* ---------- Category tabs ---------- */
  .tabs{
    max-width:980px; margin:16px auto 0;
    padding:0 20px 4px;
    display:flex; gap:8px; overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tabs-wrap{position:relative; max-width:980px; margin:16px auto 0;}
  .tabs-wrap .tabs{margin:0; padding:0 20px 4px;}
  .tab-arrow{
    position:absolute; top:0; bottom:4px; width:34px;
    display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer; font-size:20px; color:var(--forest);
    background:linear-gradient(90deg, var(--moss-bg) 40%, transparent);
    z-index:2;
  }
  .tab-arrow.left{left:0;}
  .tab-arrow.right{right:0; transform:scaleX(-1); background:linear-gradient(90deg, var(--moss-bg) 40%, transparent);}
  @media(hover:none){ .tab-arrow{display:none;} }
  .tab{
    flex-shrink:0;
    display:flex; align-items:center; gap:7px;
    padding:9px 15px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:13.5px;
    font-weight:500;
    color:var(--forest-soft);
    cursor:pointer;
    transition:all .15s;
  }
  .tab svg{width:14px; height:14px;}
  .tab.active{
    background:var(--forest);
    border-color:var(--forest);
    color:var(--white);
  }

  /* ---------- Main / grid ---------- */
  main{max-width:980px; margin:0 auto; padding:22px 20px 120px;}
  .section-title{
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:500;
    margin:26px 0 4px;
    display:flex; align-items:center; gap:8px;
  }
  .section-sub{
    font-size:13px; color:var(--forest-soft); margin-bottom:14px;
  }
  .divider{
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px);
    margin:8px 0 18px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:14px;
  }
  .grid-events{
    grid-template-columns:repeat(auto-fill, minmax(320px,1fr));
  }
  .card{
    background:var(--cream-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    display:flex; flex-direction:column; gap:8px;
    box-shadow:var(--shadow);
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(28,46,30,0.12);}
  .card-icon{font-size:26px; line-height:1;}
  .card-img{
    width:100%; aspect-ratio:4/3; object-fit:cover;
    border-radius:10px; background:var(--moss-bg-2);
    margin:-2px 0 2px;
  }
  .card-img.product-img{
    aspect-ratio:3/4;
  }
  .card h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:16.5px;
    margin:0;
  }
  .card p{
    font-size:12.8px;
    color:var(--forest-soft);
    line-height:1.45;
    margin:0;
    flex:1;
  }
  .more-info{
    align-self:flex-start;
    background:none; border:none; padding:0;
    font-size:12px; font-weight:600; color:var(--ochre-dark);
    text-decoration:underline; cursor:pointer;
  }
  .video-btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 16px; border-radius:999px;
    border:1.5px solid var(--ochre); color:var(--ochre-dark);
    background:transparent; font-size:13px; font-weight:600;
    text-decoration:none; cursor:pointer; width:fit-content;
  }
  .video-btn:hover{background:rgba(184,134,59,0.1);}
  .card-footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:6px;
  }
  .price-block{display:flex; flex-direction:column; line-height:1.25;}
  .price{
    font-family:'JetBrains Mono', monospace;
    font-size:14.5px;
    font-weight:500;
    color:var(--ochre-dark);
  }
  .price-bs{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--forest-soft);
  }
  .qty-controls{
    display:flex; align-items:center; gap:8px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 6px;
  }
  .qty-controls button{
    width:22px; height:22px;
    border-radius:50%;
    border:none;
    background:var(--moss-bg-2);
    color:var(--forest);
    font-size:14px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .qty-controls span{font-size:13px; min-width:14px; text-align:center; font-family:'JetBrains Mono',monospace;}
  .add-btn{
    width:100%;
    margin-top:2px;
    padding:9px;
    border:none;
    border-radius:999px;
    background:var(--forest);
    color:var(--white);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:background .15s;
  }
  .add-btn:hover{background:#243a26;}
  .add-btn.added{background:var(--ochre);}

  .soon-card{
    grid-column:1/-1;
    text-align:center;
    padding:34px 20px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    color:var(--forest-soft);
    font-size:13.5px;
    background:var(--white);
  }
  .soon-card b{color:var(--forest); font-family:'Fraunces',serif; font-weight:500; display:block; margin-bottom:4px; font-size:15px;}

  /* Reserva */
  .reserva-card{padding:16px; display:flex; flex-direction:column; gap:8px;}
  .reserva-card .reserva-fields{display:grid; grid-template-columns:1fr; gap:8px; margin-top:4px;}
  .reserva-card select, .reserva-card input[type=date]{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    font-family:'Work Sans',sans-serif; font-size:13.5px; background:var(--white); color:var(--forest);
  }
  .reserva-card label{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--forest-soft); font-weight:500; display:block; margin-bottom:4px;}

  /* ---------- Cart drawer ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(28,46,30,.35);
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:30;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; height:100%;
    width:min(380px, 92vw);
    background:var(--white);
    box-shadow:-6px 0 24px rgba(0,0,0,.15);
    transform:translateX(100%);
    transition:transform .25s ease;
    z-index:31;
    display:flex; flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{
    padding:20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .drawer-head h2{font-family:'Fraunces',serif; font-size:19px; font-weight:500; margin:0;}
  .drawer-head button{background:none; border:none; font-size:20px; cursor:pointer; color:var(--forest-soft);}
  .drawer-items{flex:1; overflow-y:auto; padding:14px 20px;}
  .drawer-empty{color:var(--forest-soft); font-size:13.5px; text-align:center; margin-top:40px;}
  .drawer-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--moss-bg-2); gap:10px;
  }
  .drawer-item .di-name{font-size:13.5px; font-weight:500;}
  .drawer-item .di-sub{font-size:11.5px; color:var(--forest-soft); font-family:'JetBrains Mono',monospace;}
  .drawer-item .di-remove{background:none;border:none;color:var(--clay);font-size:12px;cursor:pointer; text-decoration:underline;}
  .drawer-foot{
    padding:18px 20px 20px; border-top:1px solid var(--line); background:var(--moss-bg);
  }
  .total-row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; color:var(--forest-soft);}
  .total-row.main{font-size:16px; color:var(--forest); font-weight:600; margin-top:8px; font-family:'JetBrains Mono',monospace;}
  .send-btn{
    width:100%; margin-top:14px; padding:13px;
    background:#25D366; color:#fff; border:none; border-radius:999px;
    font-weight:600; font-size:14.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .send-btn:disabled{opacity:.5; cursor:not-allowed;}
  .first-note{
    font-size:11.5px; color:var(--ochre-dark); margin-top:10px; text-align:center; font-weight:500;
  }

  footer{
    text-align:center; padding:26px 20px 90px; font-size:11.5px; color:var(--forest-soft);
  }

  /* ---------- Modal "Más info" ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(28,46,30,.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none; transition:opacity .2s;
    z-index:40;
  }
  .modal-overlay.show{opacity:1; pointer-events:auto;}
  .modal-box{
    background:var(--white);
    border-radius:18px;
    max-width:460px; width:100%;
    max-height:85vh; overflow-y:auto;
    padding:0;
    transform:translateY(12px) scale(.98);
    transition:transform .2s;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-overlay.show .modal-box{transform:translateY(0) scale(1);}
  .ref-badge{display:inline-block;font-size:11px;color:var(--ochre-dark, #a3672b);font-weight:600;background:rgba(163,103,43,0.1);border:1px solid rgba(163,103,43,0.3);padding:3px 9px;border-radius:100px;cursor:pointer;margin-top:4px;}
  .ref-badge:hover{background:rgba(163,103,43,0.18);}
  .modal-img{width:100%; aspect-ratio:16/10; object-fit:cover; display:block;}
  .modal-body{padding:22px;}
  .modal-body h2{font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0 0 6px;}
  .modal-price{font-family:'JetBrains Mono',monospace; color:var(--ochre-dark); font-size:16px; margin-bottom:14px;}
  .modal-price small{color:var(--forest-soft); font-size:12px; margin-left:8px;}
  .modal-body p{font-size:13.8px; line-height:1.6; color:var(--forest-soft); margin:0 0 18px; white-space:pre-line;}
  .modal-actions{display:flex; gap:10px; align-items:center;}
  .modal-close{
    position:sticky; top:12px; margin-left:auto; margin-right:12px; float:right;
    width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(28,46,30,.55); color:#fff; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Floating order bar ---------- */
  .float-bar{
    position:fixed; left:0; right:0; bottom:0;
    z-index:25;
    display:flex; justify-content:center;
    padding:0 16px 16px;
    transform:translateY(120%);
    transition:transform .25s ease;
    pointer-events:none;
  }
  .float-bar.show{transform:translateY(0); pointer-events:auto;}
  .float-bar-inner{
    width:100%; max-width:640px;
    background:#1f7a43;
    color:#fff;
    border-radius:16px;
    padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:0 10px 30px rgba(20,60,30,.35);
    cursor:pointer;
  }
  .float-bar-left{display:flex; flex-direction:column;}
  .float-bar-left .fb-count{font-size:11.5px; opacity:.85;}
  .float-bar-left .fb-total{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600;}
  .float-bar-right{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.15);
    padding:9px 16px; border-radius:999px;
    font-size:13.5px; font-weight:600;
  }

  /* ---------- Letra más grande solo en celular (no toca la versión web) ---------- */
  @media (max-width:640px){
    body{ font-size:16px; }
    .brand .tag{ font-size:14px; }
    .search-box input{ font-size:16px; }
    .cart-btn{ font-size:14.5px; }
    .tabs button{ font-size:15.5px; }
    h3{ font-size:19px; }
    .card p{ font-size:15px; }
    .price{ font-size:16px; }
    .add-btn, .more-info{ font-size:16px; }
    .qty-controls span{ font-size:15.5px; }
    .reserva-card label{ font-size:13px; }
    .reserva-fields input, .reserva-fields select{ font-size:16px; }
    .ref-badge{ font-size:13px; }
    .drawer-item .di-name{ font-size:15.5px; }
    .drawer-item .di-sub{ font-size:13.5px; }
    .total-row{ font-size:15px; }
    .total-row.main{ font-size:18px; }
    .modal-body h2{ font-size:24px; }
    .modal-body p{ font-size:16px; }
    .modal-price{ font-size:18px; }
    .float-bar-left .fb-count{ font-size:13.5px; }
    .float-bar-left .fb-total{ font-size:18px; }
    .float-bar-right{ font-size:15.5px; }
    footer{ font-size:13.5px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--forest)" stroke-width="1.6"><path d="M12 21c0-6 3-9 8-11-1 6-3 9-8 11Z"/><path d="M12 21c0-7-3-11-9-13 1 7 4 11 9 13Z"/></svg>
      <h1>Naturaleza Abierta</h1>
    </div>
    <div class="tag">Catálogo &amp; pedidos</div>
    <div class="ref-banner" id="refBanner"></div>

    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--forest)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar producto, servicio o experiencia…">
      </div>
      <button class="cart-btn" id="cartBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h2l2.4 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
        Pedido <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>

  <div class="tabs-wrap">
    <button class="tab-arrow left" id="tabsLeft" aria-label="Ver categorías anteriores">‹</button>
    <div class="tabs" id="tabs"></div>
    <button class="tab-arrow right" id="tabsRight" aria-label="Ver más categorías">›</button>
  </div>
</header>

<main id="main"></main>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Tu pedido</h2>
    <button id="closeDrawer">✕</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div class="total-row"><span>Total USD</span><span id="totalUsd">$0.00</span></div>
    <div class="total-row"><span>Tasa BCV</span><span id="tasaBcv">Bs 0,00</span></div>
    <div class="total-row main"><span>Total Bs (BCV)</span><span id="totalBs">Bs 0,00</span></div>
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Z"/></svg>
      Enviar pedido a Valentina
    </button>
    <div class="first-note">✨ Si es tu primera compra, recibirás tu código de referido</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="float-bar" id="floatBar">
  <div class="float-bar-inner" id="floatBarInner">
    <div class="float-bar-left">
      <span class="fb-count" id="fbCount">0 productos</span>
      <span class="fb-total" id="fbTotal">$0.00</span>
    </div>
    <div class="float-bar-right">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Z"/></svg>
      Hacer el pedido a Valentina
    </div>
  </div>
</div>

<footer>Naturaleza Abierta · precios sujetos a disponibilidad · tasa BCV referencial</footer>

<script>
/* ============================================================
   CONEXIÓN EN VIVO a las dos pestañas publicadas de la hoja
   Base_Comercial_NA_v7. Cada vez que se abre esta página se
   leen ambos CSV — si agregas, editas o marcas "Disponible" una
   fila en la hoja, el catálogo se actualiza solo, sin tocar código.
   ============================================================ */
const CONFIG = {
  productosCSV: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTHJnzksFQFHifpcAAIXdo4XL_KePxhkYKnAkVJPY5B1smJAkis0I-AwapS-dXan4NHE9bRzsV3CuhK/pub?gid=1859546823&single=true&output=csv",
  eventosCSV: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTHJnzksFQFHifpcAAIXdo4XL_KePxhkYKnAkVJPY5B1smJAkis0I-AwapS-dXan4NHE9bRzsV3CuhK/pub?gid=1950519019&single=true&output=csv",

// --- Utilidades para leer los CSV publicados de Google Sheets ---
function normHeader(h){
  return h.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\(.*?\)/g,'').trim().replace(/\s+/g,'_');
}
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const headers = rows.shift().map(normHeader);
  return rows.filter(r=>r.some(v=>v && v.trim())).map(r=>{
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (r[i]||'').trim());
    return obj;
  });
}
function getEstadoVal(row){
  if('estado' in row) return row.estado;
  const k = Object.keys(row).find(k=>k.startsWith('estado'));
  return k ? row[k] : '';
}
async function fetchCSV(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('No se pudo cargar '+url);
  return parseCSV(await res.text());
}
function numOrNull(v){
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

async function loadData(){
  const [productosRaw, eventosRaw, tasaRaw] = await Promise.all([
    fetchCSV(CONFIG.productosCSV).catch(()=>[]),
    fetchCSV(CONFIG.eventosCSV).catch(()=>[]),
    CONFIG.tasaCSV ? fetchCSV(CONFIG.tasaCSV).catch(()=>[]) : Promise.resolve([])
  ]);

  // Fila esperada en CONFIG_BCV: columna "campo" = tasa_bcv, columna "valor" = 214.35
  const filaTasa = tasaRaw.find(r => (r.campo||'').toLowerCase().trim() === 'tasa_bcv');
  if(filaTasa){
    const tasaReal = numOrNull(filaTasa.valor);
    if(tasaReal) tasaBcv = tasaReal;
  }

  PRODUCTOS = productosRaw
    .filter(r => r.id && r.nombre)
    .map(r => {
      const cat = r.categoria || 'Otros';
      const partes = [r.descripcion, r.beneficios, r.ideal_para ? 'Ideal para: '+r.ideal_para : '', r.incluye ? 'Incluye: '+r.incluye : ''].filter(Boolean);
      return {
        id: r.id,
        categoria: cat,
        icon: ICONO_POR_CATEGORIA[cat] || '🌿',
        imagen: r.imagen_url || '',
        video: r.video_url || '',
        nombre: r.nombre,
        descripcion: r.resumen_corto || r.descripcion || '',
        descripcionLarga: partes.join('\n\n'),
        precio: numOrNull(r.precio), // null = "Consultar precio" (ej. Pendiente por definir)
        disponible: getEstadoVal(r).toLowerCase().trim() === 'disponible',
        comisionN1: r.comision_referido_directo_n1 || '',
        comisionN2: r.comision_referido_indirecto_n2 || '',
        comisionN3: r.comision_referido_indirecto_n3 || ''
      };
    });

  EVENTOS = eventosRaw
    .filter(r => r.id && r.nombre && getEstadoVal(r).toLowerCase().trim() === 'disponible' && numOrNull(r.precio) !== null)
    .map(r => {
      const fechaTxt = [r.ciudad_estado, [r.fecha, r.hora].filter(Boolean).join(' · ')].filter(Boolean).join(': ') || 'Fecha por confirmar';
      const partesEv = [r.descripcion, r.beneficios, r.ideal_para ? 'Ideal para: '+r.ideal_para : '', r.incluye ? 'Incluye: '+r.incluye : ''].filter(Boolean);
      return {
        id: r.id,
        categoria: r.categoria || 'Reservas presenciales',
        nombre: r.nombre,
        descripcion: r.descripcion || '',
        descripcionLarga: partesEv.join('\n\n'),
        imagen: r.imagen_url || '',
        video: r.video_url || '',
        fechas: [fechaTxt],
        precio: numOrNull(r.precio),
        cupos: r.cupos_disponibles || '—',
        comisionN1: r.comision_referido_directo_n1 || '',
        comisionN2: r.comision_referido_indirecto_n2 || '',
        comisionN3: r.comision_referido_indirecto_n3 || ''
      };
    });
}

// --- Construir tabs dinámicamente a partir de las categorías con producto o evento disponible ---
function getActiveCategories(){
  const cats = new Set(PRODUCTOS.filter(p=>p.disponible).map(p=>p.categoria));
  EVENTOS.forEach(e=> cats.add(e.categoria));
  return Array.from(cats);
}

function iconSvg(name, size=14){
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.7">${ICONS[name]||ICONS.leaf}</svg>`;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  const cats = getActiveCategories();
  let html = `<div class="tab ${activeCat==='Todo'?'active':''}" data-cat="Todo">${iconSvg('leaf')} Todo</div>`;
  cats.forEach(c=>{
    const meta = CATEGORIAS_META[c] || {icon:'leaf'};
    html += `<div class="tab ${activeCat===c?'active':''}" data-cat="${c}">${iconSvg(meta.icon)} ${c}</div>`;
  });
  tabs.innerHTML = html;
  tabs.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
    activeCat = t.dataset.cat;
    renderTabs();
    renderMain();
  }));
}

function fmtUsd(n){ return '$' + n.toFixed(2); }
function fmtBs(n){ return 'Bs ' + n.toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function renderMain(){
  const main = document.getElementById('main');
  const term = searchTerm.trim().toLowerCase();
  let cats = getActiveCategories();
  if(activeCat !== 'Todo') cats = cats.filter(c=>c===activeCat);

  let html = '';

  cats.forEach(cat=>{
    const shouldShow = activeCat==='Todo' || activeCat===cat;
    if(!shouldShow) return;
    const meta = CATEGORIAS_META[cat] || {icon:'leaf'};
    let sectionHtml = '';

    // Eventos de esta categoría (retiros, actividades, reservas presenciales, etc.)
    let evItems = EVENTOS.filter(e=>e.categoria===cat);
    if(term) evItems = evItems.filter(e=> (e.nombre+e.descripcion).toLowerCase().includes(term));
    if(evItems.length){
      sectionHtml += `<div class="grid grid-events">`;
      const blockedByProducts = cartHasProducts();
      evItems.forEach(ev=>{
        const evQty = eventQty[ev.id] || 1;
        sectionHtml += `<div class="card reserva-card">
          ${ev.imagen ? `<img class="card-img" src="${ev.imagen}" alt="${ev.nombre}">` : `<div class="card-icon">🪶</div>`}
          <h3>${ev.nombre}</h3>
          <p>Quedan ${ev.cupos} cupos · ${fmtUsd(ev.precio)} por persona</p>
          <button class="more-info" onclick="openEventInfo('${ev.id}')">Más info</button>
          ${ev.comisionN1 ? `<span class="ref-badge" onclick="openReferralInfo('${ev.id}', true)">✦ Gana refiriendo esta experiencia</span>` : ''}
          <div class="reserva-fields">
            <div>
              <label>Fecha</label>
              <select id="fecha_${ev.id}" ${blockedByProducts?'disabled':''}>${ev.fechas.map(f=>`<option>${f}</option>`).join('')}</select>
            </div>
            <div>
              <label>Nombre para la reserva</label>
              <input type="text" id="nombre_${ev.id}" placeholder="Tu nombre completo" ${blockedByProducts?'disabled':''}>
            </div>
            <div>
              <label>Cupos</label>
              <div class="qty-controls">
                <button onclick="changeEventQty('${ev.id}',-1)" ${blockedByProducts?'disabled':''}>−</button>
                <span id="qtyval_${ev.id}">${evQty}</span>
                <button onclick="changeEventQty('${ev.id}',1)" ${blockedByProducts?'disabled':''}>+</button>
              </div>
            </div>
          </div>
          ${blockedByProducts
            ? `<button class="add-btn" style="opacity:.5;cursor:not-allowed;" disabled>Reservar cupo</button>
               <p style="font-size:12px;color:var(--clay);margin:6px 0 0;">Los retiros y experiencias se reservan por separado 🌿. Termina este pedido primero, o vacía el carrito para reservar tu experiencia.</p>`
            : `<button class="add-btn" onclick="reservarEvento('${ev.id}')">Reservar cupo</button>`}
        </div>`;
      });
      sectionHtml += `</div>`;
    }

    // Productos normales de esta categoría
    let items = PRODUCTOS.filter(p=>p.categoria===cat && p.disponible);
    if(term) items = items.filter(p=> (p.nombre+p.descripcion).toLowerCase().includes(term));
    if(items.length){
      sectionHtml += `<div class="grid">`;
      const blockedByEvents = cartHasEvents();
      items.forEach(p=>{
        const qty = cart[p.id]||0;
        sectionHtml += `<div class="card">
        ${p.imagen ? `<img class="card-img product-img" src="${p.imagen}" alt="${p.nombre}">` : `<div class="card-icon">${p.icon}</div>`}
        <h3>${p.nombre}</h3>
        <p>${p.descripcion}</p>
        <button class="more-info" onclick="openInfo('${p.id}')">Más info</button>
        ${p.comisionN1 ? `<span class="ref-badge" onclick="openReferralInfo('${p.id}', false)">✦ Gana refiriendo este producto</span>` : ''}
        <div class="card-footer">
          <div class="price-block">
            ${p.precio!==null
              ? `<span class="price">${fmtUsd(p.precio)}</span><span class="price-bs">${fmtBs(p.precio*tasaBcv)}</span>`
              : `<span class="price" style="font-size:13px;opacity:.65;">Consultar precio</span>`}
          </div>
          ${p.precio===null
            ? `<button class="add-btn" style="width:auto;padding:8px 14px;opacity:.5;cursor:not-allowed;" disabled>Consultar</button>`
            : (qty>0 ? `<div class="qty-controls">
              <button onclick="changeQty('${p.id}',-1)">−</button>
              <span>${qty}</span>
              <button onclick="changeQty('${p.id}',1)">+</button>
            </div>` : (blockedByEvents
              ? `<button class="add-btn" style="width:auto;padding:8px 14px;opacity:.5;cursor:not-allowed;" disabled>Agregar</button>`
              : `<button class="add-btn" style="width:auto;padding:8px 14px;" onclick="changeQty('${p.id}',1)">Agregar</button>`))}
        </div>
        ${(qty===0 && blockedByEvents) ? `<p style="font-size:12px;color:var(--clay);margin:6px 0 0;">Los retiros y experiencias se reservan por separado 🌿. Termina este pedido primero, o vacía el carrito para agregar productos.</p>` : ''}
      </div>`;
      });
      sectionHtml += `</div>`;
    }

    if(!sectionHtml) return;
    html += `<div class="section-title">${iconSvg(meta.icon,18)} ${cat}</div><div class="divider"></div>` + sectionHtml;
  });

  if(!html){
    html = `<div class="grid" style="margin-top:20px;"><div class="soon-card"><b>Sin resultados</b>Prueba con otra palabra o revisa otra categoría.</div></div>`;
  }

  main.innerHTML = html;
}

window.changeEventQty = function(evId, delta){
  const current = eventQty[evId] || 1;
  const next = current + delta;
  eventQty[evId] = next < 1 ? 1 : next;
  const span = document.getElementById('qtyval_'+evId);
  if(span) span.textContent = eventQty[evId];
}

function reservarEvento(evId){
  const ev = EVENTOS.find(e=>e.id===evId);
  const fecha = document.getElementById('fecha_'+evId).value;
  const nombre = document.getElementById('nombre_'+evId).value.trim();
  const qty = eventQty[evId] || 1;
  if(!nombre){ alert('Escribe tu nombre para la reserva'); return; }
  cart['RESERVA::'+evId+'::'+fecha+'::'+nombre] = {tipo:'reserva', nombre:ev.nombre, fecha, persona:nombre, precio:ev.precio, qty};
  renderCartCount();
  openDrawer();
}

window.changeQty = function(id, delta){
  cart[id] = (cart[id]||0) + delta;
  if(cart[id] <= 0) delete cart[id];
  renderMain();
  renderCartCount();
  renderDrawer();
}

window.removeFromCart = function(key){
  delete cart[key];
  renderMain();
  renderCartCount();
  renderDrawer();
}

function cartHasProducts(){
  return Object.values(cart).some(v => !(typeof v === 'object' && v.tipo === 'reserva'));
}
function cartHasEvents(){
  return Object.values(cart).some(v => typeof v === 'object' && v.tipo === 'reserva');
}

function cartLineItems(){
  const lines = [];
  Object.entries(cart).forEach(([key, val])=>{
    if(typeof val === 'object' && val.tipo === 'reserva'){
      lines.push({key, label:`${val.nombre} — ${val.fecha} (${val.persona})`, qty:val.qty, subtotal:val.precio*val.qty});
    } else {
      const p = PRODUCTOS.find(x=>x.id===key);
      if(!p) return;
      lines.push({key, label:p.nombre, qty:val, subtotal:p.precio*val});
    }
  });
  return lines;
}

function renderCartCount(){
  const lines = cartLineItems();
  const count = lines.reduce((s,l)=>s+l.qty,0);
  document.getElementById('cartCount').textContent = count;
}

function renderDrawer(){
  const lines = cartLineItems();
  const container = document.getElementById('drawerItems');
  if(!lines.length){
    container.innerHTML = `<div class="drawer-empty">Tu pedido está vacío.<br>Agrega productos del catálogo.</div>`;
  } else {
    container.innerHTML = lines.map(l=>`
      <div class="drawer-item">
        <div>
          <div class="di-name">${l.label}</div>
          <div class="di-sub">${l.qty} × ${fmtUsd(l.subtotal/l.qty)}</div>
          <button class="di-remove" onclick="removeFromCart('${l.key}')">Quitar</button>
        </div>
        <div>${fmtUsd(l.subtotal)}</div>
      </div>`).join('');
  }
  const totalUsd = lines.reduce((s,l)=>s+l.subtotal,0);
  document.getElementById('totalUsd').textContent = fmtUsd(totalUsd);
  document.getElementById('tasaBcv').textContent = fmtBs(tasaBcv);
  document.getElementById('totalBs').textContent = fmtBs(totalUsd*tasaBcv);
  document.getElementById('sendBtn').disabled = lines.length === 0;
}

function openDrawer(){
  document.getElementById('drawer').classList.add('show');
  document.getElementById('overlay').classList.add('show');
  renderDrawer();
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('cartBtn').addEventListener('click', openDrawer);
document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
document.getElementById('overlay').addEventListener('click', closeDrawer);
document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value;
  renderMain();
});

function enviarPedido(){
  const lines = cartLineItems();
  if(!lines.length) return;
  const totalUsd = lines.reduce((s,l)=>s+l.subtotal,0);
  let msg = `🛒 *NUEVO PEDIDO*${refCode?` [REF: ${refCode}]`:''}\n\n`;
  lines.forEach(l=>{ msg += `• ${l.qty>1?l.qty+'x ':''}${l.label} — ${fmtUsd(l.subtotal)}\n`; });
  msg += `\nTotal: ${fmtUsd(totalUsd)} (≈ ${fmtBs(totalUsd*tasaBcv)} a tasa BCV)`;
  const waUrl = `https://wa.me/584221482602?text=${encodeURIComponent(msg)}`;
  window.open(waUrl, '_blank');
}
document.getElementById('sendBtn').addEventListener('click', enviarPedido);

        ${item.comisionN1 ? `<div style="display:flex;justify-content:space-between;padding:10px 14px;border-radius:10px;background:rgba(163,103,43,0.08);"><span>Tu referido directo</span><b>${item.comisionN1}</b></div>` : ''}
        ${item.comisionN2 ? `<div style="display:flex;justify-content:space-between;padding:10px 14px;border-radius:10px;background:rgba(163,103,43,0.05);"><span>Referido de tu referido</span><b>${item.comisionN2}</b></div>` : ''}
        ${item.comisionN3 ? `<div style="display:flex;justify-content:space-between;padding:10px 14px;border-radius:10px;background:rgba(163,103,43,0.03);"><span>Tercera capa de tu red</span><b>${item.comisionN3}</b></div>` : ''}
      </div>
      <p style="margin-top:14px;font-size:13px;opacity:.75;">Es decir: ganas más de ${item.comisionN1 || 'un %'} en total por cada venta que se genere gracias a ti, sumando las capas de tu red. Compra hoy y te entregamos tu código para empezar a compartir.</p>
    </div>`;
  document.getElementById('modalOverlay').classList.add('show');
}

// --- Floating bar ---
function renderFloatBar(){
  const lines = cartLineItems();
  const bar = document.getElementById('floatBar');
  if(!lines.length){ bar.classList.remove('show'); return; }
  const count = lines.reduce((s,l)=>s+l.qty,0);
  const totalUsd = lines.reduce((s,l)=>s+l.subtotal,0);
  document.getElementById('fbCount').textContent = count + (count===1?' producto':' productos');
  document.getElementById('fbTotal').textContent = fmtUsd(totalUsd) + ' · ' + fmtBs(totalUsd*tasaBcv);
  bar.classList.add('show');
}

// Envolver el cambio de carrito para refrescar también la barra flotante
const _origChangeQty = window.changeQty;
window.changeQty = function(id, delta){
  _origChangeQty(id, delta);
  renderFloatBar();
}
const _origReservar = reservarEvento;
window.reservarEvento = function(evId){
  _origReservar(evId);
  renderFloatBar();
}

// --- Navegación de la barra de categorías en pantallas anchas ---
const tabsEl = document.getElementById('tabs');
document.getElementById('tabsLeft').addEventListener('click', ()=> tabsEl.scrollBy({left:-160, behavior:'smooth'}));
document.getElementById('tabsRight').addEventListener('click', ()=> tabsEl.scrollBy({left:160, behavior:'smooth'}));
tabsEl.addEventListener('wheel', e=>{
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
    e.preventDefault();
    tabsEl.scrollLeft += e.deltaY;
  }
}, {passive:false});

// Init — espera a que lleguen los datos reales de la hoja antes de dibujar
loadData().finally(()=>{
  renderTabs();
  renderMain();
  renderCartCount();
  renderDrawer();
  renderFloatBar();
});
</script>
</body>
</html>
