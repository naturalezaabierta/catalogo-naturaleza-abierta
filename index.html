<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naturaleza Abierta · Catálogo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/tienda.css"></head><body><header class="top" id="top"></header>
<main class="wrap">
<section class="hero"><h1>Bienestar natural, hecho con conciencia</h1><p>Suplementos, experiencias y combos de Naturaleza Abierta. Elige, aparta y paga aquí mismo, o deja que Valentina te guíe por WhatsApp.</p></section>
<div class="banner" id="refBanner"></div>
<input class="search" id="q" type="search" placeholder="Buscar producto o experiencia…">
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"><p style="color:var(--muted)">Cargando…</p></div>
</main>
<footer id="foot"></footer><script src="assets/js/app.js"></script>
<script>
(async function(){
  NA.init();
  const {$, esc} = NA;
  let D, cat='Todo', q='';
  try{ D = await NA.catalogo(); }catch(e){ $('#grid').innerHTML='<p>No pudimos cargar el catálogo. Intenta de nuevo en un momento.</p>'; return; }
  const items = [
    ...(D.productos||[]).filter(p=>p.estado==='Disponible').map(p=>({...p, kind:'p', href:'producto.html?id='+encodeURIComponent(p.id)})),
    ...(D.eventos||[]).filter(e=>e.estado==='Disponible').map(e=>({...e, kind:'e', href:'experiencia.html?id='+encodeURIComponent(e.id)}))
  ];
  function tabs(){
    const cats=[...new Set(items.map(i=>i.categoria))];
    $('#tabs').innerHTML=['Todo',...cats].map(c=>'<div class="tab '+(c===cat?'active':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</div>').join('');
    $('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cat=t.dataset.c;tabs();draw();});
  }
  function draw(){
    const L=items.filter(i=>(cat==='Todo'||i.categoria===cat)&&(!q||(i.nombre+' '+(i.resumen_corto||'')+' '+(i.descripcion||'')).toLowerCase().includes(q)));
    $('#grid').innerHTML=L.length?L.map(i=>'<a class="card" href="'+i.href+'"><div class="im"><img loading="lazy" src="'+esc(NA.imgOf(i))+'" alt="'+esc(i.nombre)+'"></div><div class="bd"><span class="cat">'+esc(i.categoria)+'</span><h3>'+esc(i.nombre)+'</h3><p>'+esc(i.kind==='e'?((i.ciudad_estado||'')+' · '+(i.fecha||'')):(i.resumen_corto||''))+'</p><div class="pr">'+NA.fmtUsd(i.precio)+' '+NA.bsLine(i.precio)+'</div></div></a>').join(''):'<p style="color:var(--muted)">No encontramos nada con eso.</p>';
  }
  $('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();draw();};
  tabs();draw();
})();
</script></body></html>
