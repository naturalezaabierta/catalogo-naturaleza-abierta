<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiencia · Naturaleza Abierta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/tienda.css"></head><body><header class="top" id="top"></header>
<main class="wrap">
<div class="crumbs"><a href="index.html">Catálogo</a> / <span id="cn">…</span></div>
<div class="banner" id="refBanner"></div>
<div id="v"><p>Cargando…</p></div>
</main>
<footer id="foot"></footer><script src="assets/js/app.js"></script>
<script>
(async function(){
  NA.init(); const {$,esc}=NA; const id=NA.qs('id');
  let D; try{D=await NA.catalogo();}catch(e){$('#v').innerHTML='<p>No pudimos cargar la experiencia.</p>';return;}
  const e=(D.eventos||[]).find(x=>x.id===id);
  if(!e){$('#v').innerHTML='<p>Esta experiencia no existe. <a href="index.html">Volver al catálogo</a></p>';return;}
  document.title=e.nombre+' · Naturaleza Abierta'; $('#cn').textContent=e.nombre;
  NA.track('ViewContent',{content_ids:[e.id],content_name:e.nombre,content_type:'product'});
  const disp=e.estado==='Disponible'&&e.cupos_disponibles>0; const pc=Number(e.porcentaje_pago_requerido)||100;
  let qty=1; const max=Math.max(1,Math.min(10,e.cupos_disponibles||1));
  const sec=(t,x)=>x?'<div class="sec"><h3>'+t+'</h3><p>'+esc(x)+'</p></div>':'';
  $('#v').innerHTML='<div class="prod"><div class="im"><img src="'+esc(NA.imgOf(e))+'" alt="'+esc(e.nombre)+'"></div><div><span class="tag">Experiencia</span><h1>'+esc(e.nombre)+'</h1>'
  +'<p style="color:var(--muted)">📍 '+esc(e.ciudad_estado||'')+'<br>📅 '+esc(e.fecha||'')+' · '+esc(e.hora||'')+'<br>👥 '+esc(e.cupos_disponibles)+' cupos disponibles</p>'
  +'<div class="price">'+NA.fmtUsd(e.precio)+' <small style="font-size:14px;color:var(--muted)">por persona</small></div><div class="bs">'+NA.bsLine(e.precio)+'</div>'
  +(disp?'<div class="sec" style="margin-top:16px"><h3>Aparta tu cupo</h3><p>'+(pc<100?'Hoy pagas el <b>'+pc+'%</b> para apartar; el resto lo pagas el día del evento.':'Pago completo para apartar.')+' Cada persona recibe su entrada con QR.</p><div class="row" style="margin:12px 0"><span>Personas:</span><div class="qty"><button id="m">−</button><span id="n">1</span><button id="pl">+</button></div></div><div class="bs" id="calc"></div><br><button class="btn ochre block" id="go">Apartar mi cupo y pagar aquí</button><div style="height:8px"></div><a class="btn wa block" id="wa" href="#">Reservar con Valentina por WhatsApp</a></div>':'<p class="tag" style="margin-top:16px">Cupos agotados</p>')
  +'</div></div>'+sec('Qué incluye',e.incluye)+sec('Descripción',e.descripcion)+sec('Beneficios',e.beneficios)+sec('Ideal para',e.ideal_para);
  if(!disp)return;
  function calc(){const t=e.precio*qty,h=pc<100?t*pc/100:t;$('#n').textContent=qty;$('#calc').innerHTML='Total: <b>'+NA.fmtUsd(t)+'</b>'+(pc<100?' · Hoy: <b>'+NA.fmtUsd(h)+'</b> · Día del evento: '+NA.fmtUsd(t-h):'');}
  $('#m').onclick=()=>{qty=Math.max(1,qty-1);calc();}; $('#pl').onclick=()=>{qty=Math.min(max,qty+1);calc();}; calc();
  $('#go').onclick=()=>{NA.store.set('na_reserva',{evento_id:e.id,nombre:e.nombre,fecha:e.fecha,hora:e.hora,ciudad:e.ciudad_estado,precio:e.precio,pct:pc,qty});NA.track('AddToCart',{content_ids:[e.id],content_name:e.nombre,content_type:'product'});location.href='pago.html?tipo=reserva';};
  $('#wa').onclick=ev=>{ev.preventDefault();const r=NA.getRef(),t=e.precio*qty,h=pc<100?t*pc/100:t;let m='🛒 *NUEVO PEDIDO*'+(r?' [REF: '+r+']':'')+'\n• '+(qty>1?qty+'x ':'')+e.nombre+' — '+NA.fmtUsd(t)+' [ID: '+e.id+'] ['+qty+' cupo(s)]'+(pc<100?' [RESERVA CON ABONO '+pc+'%: hoy '+NA.fmtUsd(h)+', resto '+NA.fmtUsd(t-h)+' el día del evento]':' [PAGO COMPLETO]')+'\n*Total: '+NA.fmtUsd(t)+'*';window.open(NA.waLink(m),'_blank');};
})();
</script></body></html>
