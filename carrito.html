<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi pedido · Naturaleza Abierta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/tienda.css"></head><body><header class="top" id="top"></header>
<main class="narrow">
<h1 style="margin:26px 0 12px">Mi pedido</h1>
<div class="banner" id="refBanner"></div>
<div id="lines"></div><div id="tot"></div>
</main>
<footer id="foot"></footer><script src="assets/js/app.js"></script>
<script>
(async function(){
  NA.init(); const {$,esc}=NA; let D;
  try{D=await NA.catalogo();}catch(e){$('#lines').innerHTML='<p>No pudimos cargar tu pedido.</p>';return;}
  function draw(){
    const c=NA.cart.all(); const L=Object.keys(c).map(id=>{const p=(D.productos||[]).find(x=>x.id===id&&x.estado==='Disponible');return p?{p,q:c[id]}:null;}).filter(Boolean);
    Object.keys(c).forEach(id=>{if(!L.find(l=>l.p.id===id))delete c[id];}); NA.cart.set(c);
    if(!L.length){$('#lines').innerHTML='<div class="sec"><p>Tu pedido está vacío.</p></div><a class="btn" href="index.html">Ver catálogo</a>';$('#tot').innerHTML='';return;}
    $('#lines').innerHTML=L.map(l=>'<div class="cartline"><img src="'+esc(NA.imgOf(l.p))+'" alt=""><div><h4>'+esc(l.p.nombre)+'</h4><small>'+NA.fmtUsd(l.p.precio)+' c/u</small><div class="qty" style="margin-top:6px"><button data-i="'+l.p.id+'" data-d="-1">−</button><span>'+l.q+'</span><button data-i="'+l.p.id+'" data-d="1">+</button></div></div><div style="text-align:right"><b>'+NA.fmtUsd(l.p.precio*l.q)+'</b><br><button class="x" data-r="'+l.p.id+'">Quitar</button></div></div>').join('');
    const tot=L.reduce((a,l)=>a+l.p.precio*l.q,0);
    $('#tot').innerHTML='<div class="totals"><div class="l"><span>Total</span><b>'+NA.fmtUsd(tot)+'</b></div>'+(NA.state.tasa?'<div class="l"><small>En bolívares (tasa BCV)</small><small>'+NA.fmtBs(tot)+'</small></div>':'')+'</div><button class="btn block" id="pay">Pagar aquí</button><div style="height:8px"></div><button class="btn wa block" id="wa">Pagar guiado con Valentina</button><p class="bs" style="margin-top:10px;text-align:center">¿Quieres una experiencia? <a href="index.html">Ver experiencias</a> (se reservan por separado)</p>';
    $('#lines').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{NA.cart.add(b.dataset.i,+b.dataset.d);draw();});
    $('#lines').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{NA.cart.setQty(b.dataset.r,0);draw();});
    $('#pay').onclick=()=>{NA.track('InitiateCheckout',{value:tot,currency:'USD',num_items:L.length,content_type:'product'});location.href='pago.html?tipo=pedido';};
    $('#wa').onclick=()=>{const r=NA.getRef();let m='🛒 *NUEVO PEDIDO*'+(r?' [REF: '+r+']':'')+'\n';L.forEach(l=>{m+='• '+(l.q>1?l.q+'x ':'')+l.p.nombre+' — '+NA.fmtUsd(l.p.precio*l.q)+' [ID: '+l.p.id+']\n';});m+='*Total: '+NA.fmtUsd(tot)+'*';NA.track('InitiateCheckout',{value:tot,currency:'USD',num_items:L.length,content_type:'product'});window.open(NA.waLink(m),'_blank');};
  }
  draw();
})();
</script></body></html>
