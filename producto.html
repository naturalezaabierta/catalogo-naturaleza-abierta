<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producto · Naturaleza Abierta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/tienda.css"></head><body><header class="top" id="top"></header>
<main class="wrap">
<div class="crumbs"><a href="index.html">Catálogo</a> / <span id="cn">…</span></div>
<div class="banner" id="refBanner"></div>
<div id="v"><p>Cargando…</p></div>
</main>
<footer id="foot"></footer><script src="assets/js/app.js"></script>
<script>
(async function(){
  NA.init(); const {$,esc}=NA; const id=NA.qs('id');
  let D; try{D=await NA.catalogo();}catch(e){$('#v').innerHTML='<p>No pudimos cargar el producto.</p>';return;}
  const p=(D.productos||[]).find(x=>x.id===id);
  if(!p){$('#v').innerHTML='<p>Este producto no existe. <a href="index.html">Volver al catálogo</a></p>';return;}
  document.title=p.nombre+' · Naturaleza Abierta'; $('#cn').textContent=p.nombre;
  NA.track('ViewContent',{content_ids:[p.id],content_name:p.nombre,content_type:'product'});
  const disp=p.estado==='Disponible'; let qty=1;
  const sec=(t,x)=>x?'<div class="sec"><h3>'+t+'</h3><p>'+esc(x)+'</p></div>':'';
  const coms=[1,2,3,4].map(n=>NA.pct(p['comision_n'+n]));
  $('#v').innerHTML='<div class="prod"><div class="im"><img src="'+esc(NA.imgOf(p))+'" alt="'+esc(p.nombre)+'"></div><div><span class="tag">'+esc(p.categoria)+'</span><h1>'+esc(p.nombre)+'</h1><p style="color:var(--muted)">'+esc(p.resumen_corto||'')+'</p><div class="price">'+NA.fmtUsd(p.precio)+'</div><div class="bs">'+NA.bsLine(p.precio)+'</div>'
  +(disp?'<div class="row" style="margin:18px 0"><div class="qty"><button id="m">−</button><span id="n">1</span><button id="pl">+</button></div><button class="btn ochre" id="add">Agregar a mi pedido</button></div><a class="btn wa block" id="wa" href="#">Pedir con Valentina por WhatsApp</a>':'<p class="tag" style="margin-top:16px">No disponible por ahora</p>')
  +(coms[0]?'<div class="refbox"><b>Programa de referidos:</b> comparte este producto y gana '+coms[0]+'% por cada compra que llegue con tu código.</div>':'')
  +'</div></div>'+sec('Qué incluye',p.incluye)+sec('Descripción',p.descripcion)+sec('Beneficios',p.beneficios)+sec('Ideal para',p.ideal_para)
  +(p.video_url?'<div class="sec"><h3>Video</h3><p><a href="'+esc(p.video_url)+'" target="_blank" rel="noopener">Ver video</a></p></div>':'');
  if(!disp)return;
  $('#m').onclick=()=>{qty=Math.max(1,qty-1);$('#n').textContent=qty;};
  $('#pl').onclick=()=>{qty=Math.min(20,qty+1);$('#n').textContent=qty;};
  $('#add').onclick=()=>{NA.cart.add(p.id,qty);NA.track('AddToCart',{content_ids:[p.id],content_name:p.nombre,content_type:'product'});location.href='carrito.html';};
  $('#wa').onclick=e=>{e.preventDefault();const r=NA.getRef();let m='🛒 *NUEVO PEDIDO*'+(r?' [REF: '+r+']':'')+'\n• '+(qty>1?qty+'x ':'')+p.nombre+' — '+NA.fmtUsd(p.precio*qty)+' [ID: '+p.id+']\n*Total: '+NA.fmtUsd(p.precio*qty)+'*';window.open(NA.waLink(m),'_blank');};
})();
</script></body></html>
