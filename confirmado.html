<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido confirmado · Naturaleza Abierta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/tienda.css"></head><body><header class="top" id="top"></header>
<main class="narrow"><div id="v"><p style="margin:30px 0">Cargando…</p></div></main>
<footer id="foot"></footer><script src="assets/js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async function(){
  NA.init(); const {$,esc}=NA; const id=NA.qs('pedido'); let tel=NA.store.get('na_tel','');
  if(!id){ $('#v').innerHTML='<p>Falta el número de pedido. <a href="index.html">Ir a la tienda</a></p>'; return; }
  if(!tel){ $('#v').innerHTML='<div class="sec" style="margin-top:30px"><h3>Confirma tu teléfono</h3><p>Para mostrarte tu pedido, escribe el WhatsApp con el que compraste.</p><div class="field" style="margin-top:10px"><input id="t" type="tel"></div><button class="btn" id="ok">Ver mi pedido</button></div>'; $('#ok').onclick=()=>{tel=NA.soloDig($('#t').value);NA.store.set('na_tel',tel);location.reload();}; return; }
  let e,R; try{ [e,R]=await Promise.all([NA.rpc('fn_estado_pedido',{p_pedido_id:id,p_telefono:tel}),NA.rpc('fn_resumen_pedido',{p_pedido_id:id,p_telefono:tel})]); }catch(x){}
  const wlink=t=>NA.waLink(t);
  if(!e||!e.ok){ $('#v').innerHTML='<div class="sec" style="margin-top:30px"><p>No encontramos ese pedido con ese teléfono.</p></div><a class="btn wa" href="'+wlink('Hola Valentina, necesito ayuda con mi pedido '+id)+'" target="_blank">Hablar con Valentina</a>'; return; }
  if(e.estado!=='pagado'){ $('#v').innerHTML='<div class="sec" style="margin-top:30px"><h3>Tu pago aún no está confirmado</h3><p>Estado: '+esc(e.estado)+'. '+esc(e.nota||'')+'</p></div><a class="btn" href="pago.html?tipo='+(e.tipo==='reserva'?'reserva':'pedido')+'">Volver a pagar</a> <a class="btn wa" href="'+wlink('Hola Valentina, necesito ayuda con mi pedido '+id)+'" target="_blank">Hablar con Valentina</a>'; return; }
  R = (R&&R.ok)?R:{items:[],total_usd:e.total_usd,total_bs:0};
  const bs = R.total_bs? ' · Bs '+Number(R.total_bs).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}) : '';
  const codigo='NA-'+tel.slice(-5), link='https://catalogo.naturalezaabierta.com/?ref='+codigo;
  const num=id.replace(/^(PED|RES)-/,'');
  const wa='<div class="sec"><h3>¿Dudas con tu '+(e.tipo==='reserva'?'reserva':'pedido')+'?</h3><p>Escríbele a Valentina cuando quieras. Ella ya tiene tu '+(e.tipo==='reserva'?'reserva':'pedido')+' y todo lo que llenaste aquí.</p><a class="btn wa block" style="margin-top:12px" href="'+wlink('Hola Valentina, ya pagué mi '+(e.tipo==='reserva'?'reserva ':'pedido ')+id)+'" target="_blank">Hablar con Valentina</a></div>';
  const correo=R.correo?'<div class="sec"><h3>Te lo enviamos al correo</h3><p>Tu resumen'+(e.tipo==='reserva'?', tus entradas con QR':', los datos de envío')+' y tu código de referido llegan a <b>'+esc(R.correo)+'</b>.</p></div>':'';
  const afil='<div class="sec" id="afsec"><h3>Tu código de referido</h3><p>Comparte y gana comisión por cada compra de tu red.</p><div class="datos"><div class="r"><span>Tu código</span><b style="font-size:20px">'+codigo+'</b></div></div><div class="row"><button class="btn ghost" id="cplink">Copiar mi enlace</button><a class="btn ghost" href="https://creativos.naturalezaabierta.com/?ref='+codigo+'" target="_blank" rel="noopener">Ver mis creativos</a></div><h3 style="margin-top:18px;font-size:16px">Para cobrar tus comisiones</h3><p class="bs">Registra dónde quieres recibirlas. Lo puedes hacer ahora o después.</p><div id="af"><div class="two" style="margin-top:10px"><div class="field"><label>Banco</label><input id="ab"></div><div class="field"><label>Teléfono de Pago Móvil</label><input id="at" type="tel"></div></div><div class="field"><label>Cédula</label><input id="ac"></div><div class="msg" id="am"></div><div class="row"><button class="btn" id="asave">Guardar mis datos</button><button class="btn ghost" id="alater">Lo hago después</button></div></div></div>';
  function bindAfil(){
    $('#cplink').onclick=ev=>NA.copiar(link,ev.target);
    $('#alater').onclick=()=>{ $('#af').innerHTML='<p class="bs">Sin problema. Puedes registrarlos después con Valentina o desde tu correo.</p>'; };
    $('#asave').onclick=async()=>{ const m=$('#am'); NA.hideMsg(m); const bank=$('#ab').value.trim(), pt=NA.soloDig($('#at').value), ced=NA.soloDig($('#ac').value); const b=$('#asave');
      if(!bank||pt.length<10||ced.length<5) return NA.showMsg(m,'err','Completa banco, teléfono y cédula.');
      b.disabled=true;
      try{ const r=await NA.rpc('fn_registrar_afiliado_pedido',{p_pedido_id:id,p_telefono:tel,p_banco:bank,p_telefono_pago:pt,p_cedula:ced,p_correo:null});
        if(r.ok||r.error==='ya_registrado'){ $('#af').innerHTML='<div class="msg show ok">Listo, tus datos de cobro quedaron registrados.</div>'; if(r.ok) NA.hook(NA.HOOK_CORREOS,{pedido_id:id,evento:'afiliado'}); }
        else { NA.showMsg(m,'err',r.mensaje||'No se pudo registrar: '+(r.error||'error')); b.disabled=false; } }
      catch(x){ NA.showMsg(m,'err','No pudimos guardar. Intenta de nuevo.'); b.disabled=false; } };
  }
  if(e.tipo==='reserva'){
    let q=null; try{ q=await NA.rpc('fn_qr_reserva',{p_pedido_id:id,p_telefono:tel}); }catch(x){}
    const base='https://anfitrion.naturalezaabierta.com/entrada/?t=';
    const ents=q&&q.ok?[{n:q.titular,t:q.titular_token,r:'Titular'},...(q.acompanantes||[]).map(a=>({n:a.nombre,t:a.token,r:'Acompañante'}))].filter(x=>x.t):[];
    const ev=R.reserva||{}, saldo=Number(ev.saldo||0);
    $('#v').innerHTML='<div class="ok-banner"><div class="bs" style="color:#E8D3AA">Reserva #'+esc(num)+'</div><h1>Abono verificado. Tu lugar está apartado.</h1><p>Tus entradas con QR ya están listas y también llegan a tu correo.'+(saldo>0?' El resto se paga el día del evento.':'')+'</p></div>'
    +'<div class="sec"><h3>Tus entradas</h3><p>Un QR por persona. Se escanea a la entrada del evento.</p><div class="qrs" id="qrs" style="margin-top:12px"></div></div>'
    +'<div class="sec"><h3>Lo que debes saber del día</h3><div class="datos"><div class="r"><span>Fecha</span><b>'+esc(ev.fecha||'')+'</b></div><div class="r"><span>Hora de encuentro</span><b>'+esc(ev.hora||'')+'</b></div><div class="r"><span>Lugar</span><b>'+esc(ev.lugar||'')+'</b></div></div>'+(saldo>0?'<p>Te quedan <b>'+NA.fmtUsd(saldo)+'</b> por pagar. Se pagan el día del evento, al llegar.</p>':'')+'</div>'
    +'<div class="sec resumen"><h3>Resumen de tu reserva</h3><div class="l"><span>'+esc(ev.evento||'')+'</span><span>'+esc(ev.personas||'')+' cupo(s)</span></div>'+(ev.total_evento?'<div class="l"><span>Total de la reserva</span><span>'+NA.fmtUsd(ev.total_evento)+'</span></div>':'')+(saldo>0?'<div class="l"><span>Resto el día del evento</span><span>'+NA.fmtUsd(saldo)+'</span></div>':'')+'<div class="l t"><span>Abono pagado</span><span>'+NA.fmtUsd(R.total_usd)+'</span></div><div class="l"><span>'+esc(R.metodo||'')+bs+'</span><span class="tag">Verificado</span></div></div>'
    +afil+correo+wa;
    $('#qrs').innerHTML=ents.map((x,i)=>'<div class="qrc"><div id="qr'+i+'" style="display:flex;justify-content:center"></div><b>'+esc(x.n||'Asistente')+'</b><span class="bs">'+x.r+'</span></div>').join('')||'<p>Tus QR llegan a tu correo y por WhatsApp.</p>';
    ents.forEach((x,i)=>{ try{ new QRCode(document.getElementById('qr'+i),{text:base+x.t,width:160,height:160}); }catch(z){} });
    bindAfil(); return;
  }
  $('#v').innerHTML='<div class="ok-banner"><div class="bs" style="color:#E8D3AA">Pedido #'+esc(num)+'</div><h1>Pago verificado. Gracias por tu compra.</h1><p>Ya registramos todo. Solo faltan unos datos para enviarte tu pedido, y te lo dejamos también en tu correo.</p></div>'
  +'<div class="sec" id="envio"><h3>Datos de envío</h3><p class="bs" style="margin-bottom:10px">Dónde quieres recibir tu pedido.</p><div class="two"><div class="field"><label>Nombre</label><input id="en"></div><div class="field"><label>Apellido</label><input id="ea"></div></div><div class="two"><div class="field"><label>Cédula</label><input id="ec"></div><div class="field"><label>Estado</label><input id="es"></div></div><div class="two"><div class="field"><label>Ciudad</label><input id="ei"></div><div class="field"><label>Punto de referencia (opcional)</label><input id="er"></div></div><div class="field"><label>Dirección completa</label><textarea id="ed" rows="2"></textarea></div><div class="msg" id="em"></div><button class="btn block" id="esave">Confirmar datos de envío</button></div>'
  +afil
  +'<div class="sec resumen"><h3>Resumen del pedido</h3>'+(R.items||[]).map(i=>'<div class="l"><span>'+i.cantidad+' × '+esc(i.nombre)+'</span><span>'+NA.fmtUsd(i.precio_unit*i.cantidad)+'</span></div>').join('')+'<div class="l t"><span>Pagado</span><span>'+NA.fmtUsd(R.total_usd)+'</span></div><div class="l"><span><b>Monto en bolívares:</b> '+(R.total_bs?'Bs '+Number(R.total_bs).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}):'—')+'</span><span class="tag">Verificado</span></div><div class="l"><small>'+esc(R.metodo||'')+(R.tasa?' · tasa BCV '+Number(R.tasa).toLocaleString('es-VE'):'')+'</small></div></div>'
  +correo+wa;
  const d=NA.store.get('na_datos',{}); if(d.nom)$('#en').value=d.nom; if(d.ape)$('#ea').value=d.ape;
  $('#esave').onclick=async()=>{ const m=$('#em'); NA.hideMsg(m); const v=k=>$('#'+k).value.trim();
    if(!v('en')||!v('ea')||NA.soloDig(v('ec')).length<5||!v('es')||!v('ei')||v('ed').length<6) return NA.showMsg(m,'err','Completa nombre, cédula, estado, ciudad y dirección.');
    const b=$('#esave'); b.disabled=true;
    try{ const r=await NA.rpc('fn_registrar_envio_pedido',{p_pedido_id:id,p_telefono:tel,p_nombre:v('en'),p_apellido:v('ea'),p_cedula:NA.soloDig(v('ec')),p_estado:v('es'),p_ciudad:v('ei'),p_direccion:v('ed'),p_referencia:v('er')||null});
      if(r.ok||r.error==='ya_registrado'){ $('#envio').innerHTML='<h3>Datos de envío guardados ✔</h3><p>Preparamos tu pedido y te avisamos cuando salga.</p>'; if(r.ok) NA.hook(NA.HOOK_CORREOS,{pedido_id:id,evento:'envio'}); }
      else { NA.showMsg(m,'err',r.mensaje||'No se pudo guardar: '+(r.error||'error')); b.disabled=false; } }
    catch(x){ NA.showMsg(m,'err','No pudimos guardar. Intenta de nuevo.'); b.disabled=false; } };
  bindAfil();
})();
</script></body></html>
