<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido confirmado · Naturaleza Abierta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/tienda.css"></head><body><header class="top" id="top"></header>
<main class="narrow"><div id="v"><p style="margin:30px 0">Cargando…</p></div></main>
<footer id="foot"></footer><script src="assets/js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async function(){
  NA.init(); const {$,esc}=NA; const id=NA.qs('pedido'); let tel=NA.store.get('na_tel','');
  if(!id){ $('#v').innerHTML='<p>Falta el número de pedido. <a href="index.html">Ir al catálogo</a></p>'; return; }
  if(!tel){ $('#v').innerHTML='<div class="sec" style="margin-top:30px"><h3>Confirma tu teléfono</h3><p>Para mostrarte tu pedido, escribe el WhatsApp con el que compraste.</p><div class="field" style="margin-top:10px"><input id="t" type="tel"></div><button class="btn" id="ok">Ver mi pedido</button></div>'; $('#ok').onclick=()=>{tel=NA.soloDig($('#t').value);NA.store.set('na_tel',tel);location.reload();}; return; }
  let e; try{ e=await NA.rpc('fn_estado_pedido',{p_pedido_id:id,p_telefono:tel}); }catch(x){}
  if(!e||!e.ok){ $('#v').innerHTML='<div class="sec" style="margin-top:30px"><p>No encontramos ese pedido con ese teléfono.</p></div><a class="btn wa" href="'+NA.waLink('Hola Valentina, necesito ayuda con mi pedido '+id)+'" target="_blank">Hablar con Valentina</a>'; return; }
  if(e.estado!=='pagado'){ $('#v').innerHTML='<div class="sec" style="margin-top:30px"><h3>Tu pago aún no está confirmado</h3><p>Estado: '+esc(e.estado)+'. '+esc(e.nota||'')+'</p></div><a class="btn" href="pago.html?tipo='+(e.tipo==='reserva'?'reserva':'pedido')+'">Volver a pagar</a> <a class="btn wa" href="'+NA.waLink('Hola Valentina, necesito ayuda con mi pedido '+id)+'" target="_blank">Hablar con Valentina</a>'; return; }
  const codigo='NA-'+tel.slice(-5), link='https://catalogo.naturalezaabierta.com/?ref='+codigo;
  const wa='<a class="btn wa block" style="margin-top:14px" href="'+NA.waLink('Hola Valentina, ya pagué mi pedido '+id)+'" target="_blank">Hablar con Valentina</a>';
  const afil=()=>'<div class="sec"><h3>Gana comisiones compartiendo</h3><p>Tu código de referido es <b>'+codigo+'</b>. Tu enlace: <a href="'+link+'">'+link+'</a></p><p class="bs" style="margin-top:8px">Para cobrar tus comisiones registra dónde quieres recibirlas (Pago Móvil):</p><div id="af"><div class="two" style="margin-top:10px"><div class="field"><label>Banco</label><input id="ab"></div><div class="field"><label>Teléfono de Pago Móvil</label><input id="at" type="tel"></div></div><div class="field"><label>Cédula</label><input id="ac"></div><div class="msg" id="am"></div><button class="btn ghost" id="asave">Registrar mis datos de cobro</button></div></div>';
  function bindAfil(){
    const b=$('#asave'); if(!b) return;
    b.onclick=async()=>{ const m=$('#am'); NA.hideMsg(m); const bank=$('#ab').value.trim(), pt=NA.soloDig($('#at').value), ced=NA.soloDig($('#ac').value);
      if(!bank||pt.length<10||ced.length<5) return NA.showMsg(m,'err','Completa banco, teléfono y cédula.');
      b.disabled=true;
      try{ const r=await NA.rpc('fn_registrar_afiliado_pedido',{p_pedido_id:id,p_telefono:tel,p_banco:bank,p_telefono_pago:pt,p_cedula:ced,p_correo:null});
        if(r.ok||r.error==='ya_registrado'){ $('#af').innerHTML='<div class="msg show ok">Listo, tus datos de cobro quedaron registrados.</div>'; if(r.ok) NA.hook(NA.HOOK_CORREOS,{pedido_id:id,evento:'afiliado'}); }
        else { NA.showMsg(m,'err',r.mensaje||'No se pudo registrar: '+(r.error||'error')); b.disabled=false; } }
      catch(x){ NA.showMsg(m,'err','No pudimos guardar. Intenta de nuevo.'); b.disabled=false; } };
  }
  if(e.tipo==='reserva'){
    let q=null; try{ q=await NA.rpc('fn_qr_reserva',{p_pedido_id:id,p_telefono:tel}); }catch(x){}
    const base='https://anfitrion.naturalezaabierta.com/entrada/?t=';
    const ents=q&&q.ok?[{n:q.titular,t:q.titular_token},...(q.acompanantes||[]).map(a=>({n:a.nombre,t:a.token}))].filter(x=>x.t):[];
    $('#v').innerHTML='<div class="ok-banner"><h1>¡Cupo confirmado!</h1><p>Pago verificado. Te enviamos el resumen a tu correo.</p></div>'
    +'<div class="sec"><h3>Tus entradas</h3><p>Muestra el QR de cada persona en la entrada del día del evento.</p><div class="qrs" id="qrs" style="margin-top:12px"></div></div>'
    +'<div class="sec"><h3>Lo que debes saber del día</h3><p>Llega a la hora de encuentro, con ropa cómoda. El resto del pago (si aplica) se cancela el día del evento. Cualquier duda, Valentina te acompaña por WhatsApp.</p></div>'+afil()+wa;
    $('#qrs').innerHTML=ents.map((x,i)=>'<div class="qrc"><div id="qr'+i+'" style="display:flex;justify-content:center"></div><b>'+esc(x.n||'Asistente')+'</b></div>').join('')||'<p>Tus QR llegan a tu correo y por WhatsApp.</p>';
    ents.forEach((x,i)=>{ try{ new QRCode(document.getElementById('qr'+i),{text:base+x.t,width:160,height:160}); }catch(z){} });
    bindAfil(); return;
  }
  $('#v').innerHTML='<div class="ok-banner"><h1>Pago verificado</h1><p>Pedido '+esc(id)+' · Te enviamos el resumen por correo.</p></div>'
  +'<div class="sec" id="envio"><h3>¿Dónde te lo enviamos?</h3><div class="two"><div class="field"><label>Nombre</label><input id="en"></div><div class="field"><label>Apellido</label><input id="ea"></div></div><div class="two"><div class="field"><label>Cédula</label><input id="ec"></div><div class="field"><label>Estado</label><input id="es"></div></div><div class="two"><div class="field"><label>Ciudad</label><input id="ei"></div><div class="field"><label>Punto de referencia (opcional)</label><input id="er"></div></div><div class="field"><label>Dirección</label><textarea id="ed" rows="2"></textarea></div><div class="msg" id="em"></div><button class="btn block" id="esave">Guardar datos de envío</button></div>'
  +afil()+wa;
  const d=NA.store.get('na_datos',{}); if(d.nom)$('#en').value=d.nom; if(d.ape)$('#ea').value=d.ape;
  $('#esave').onclick=async()=>{ const m=$('#em'); NA.hideMsg(m); const v=k=>$('#'+k).value.trim();
    if(!v('en')||!v('ea')||NA.soloDig(v('ec')).length<5||!v('es')||!v('ei')||v('ed').length<6) return NA.showMsg(m,'err','Completa nombre, cédula, estado, ciudad y dirección.');
    const b=$('#esave'); b.disabled=true;
    try{ const r=await NA.rpc('fn_registrar_envio_pedido',{p_pedido_id:id,p_telefono:tel,p_nombre:v('en'),p_apellido:v('ea'),p_cedula:NA.soloDig(v('ec')),p_estado:v('es'),p_ciudad:v('ei'),p_direccion:v('ed'),p_referencia:v('er')||null});
      if(r.ok||r.error==='ya_registrado'){ $('#envio').innerHTML='<h3>Datos de envío guardados ✔</h3><p>Preparamos tu pedido y te avisamos cuando salga.</p>'; if(r.ok) NA.hook(NA.HOOK_CORREOS,{pedido_id:id,evento:'envio'}); }
      else { NA.showMsg(m,'err',r.mensaje||'No se pudo guardar: '+(r.error||'error')); b.disabled=false; } }
    catch(x){ NA.showMsg(m,'err','No pudimos guardar. Intenta de nuevo.'); b.disabled=false; } };
  bindAfil();
})();
</script></body></html>
